substitutions:
  name: "hlk-ld6001a-xiao"
  friendly_name: "HLK-LD6001A plafond (XIAO ESP32-S3 Plus)"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # Meme sequence de demarrage prudente que le projet HLK-LD6001B (attente
  # WiFi confirmee avant tout AT+RESET, evite le brownout documente dans
  # HLK-LD6001B/XIAO-ESP32S3/MAINTENANCE.md) -- voir PROTOCOL.md et
  # hlk_ld6001a.cpp::loop() pour la suite de la sequence (AT+STOP, reglages,
  # AT+READ, puis AT+DEBUG=2 et AT+START).
  #
  # Protections brownout du 6001B Plus portees le 2026-09-26, en reaction a
  # un brownout reellement observe sur cette carte (condition posee par
  # l'utilisateur le 2026-09-21) : premier demarrage apres une mise a jour
  # OTA, reset "brownout" a ~44 s, donc avant la validation de l'image par
  # safe_mode (1 min) -> retour automatique a l'image precedente.
  # (1) AT+STOP dans hlk_ld6001a.cpp setup(), avant le demarrage du WiFi ;
  # (2) WiFi non demarre automatiquement (wifi: enable_on_boot: false),
  # active ici apres 8 s. Meme valeurs que le 6001B (PLAN.md HLK-LD6001B
  # Phases 2 et 11, 3 cycles a froid propres).
  on_boot:
    priority: -100
    then:
      - delay: 8s
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - delay: 2s
      - uart.write:
          id: radar_uart
          data: "AT+RESET\n"

# Seeed XIAO ESP32-S3 PLUS (2026-09-25) -- meme carte que la production
# HLK-LD6001B : board id officiel seeed_xiao_esp32_s3_plus (ESPHome
# 2026.8.0), flash 16MB (puce Puya P25Q128HA, verifiee par esptool flash-id
# sur cette unite le 2026-09-21), meme UART0 natif D6/D7 et meme USB natif.
esp32:
  board: seeed_xiao_esp32_s3_plus
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # Meme raison que le projet HLK-LD6001B : le composant hlk_ld6001a
    # lance son propre esp_http_server (3D viewer + reglages), qu'ESPHome
    # ne compte pas dans son auto-dimensionnement de
    # CONFIG_LWIP_MAX_SOCKETS -- sans ce reglage, epuisement du pool de
    # sockets ("httpd_accept_conn: error in accept (23)") en usage reel.
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "24"

# Port USB natif du S3 (USB-CDC) -- logs forces sur USB_SERIAL_JTAG pour ne
# jamais disputer GPIO43/44 (UART0 ROM bootloader) avec le bus UART du
# radar ci-dessous.
logger:
  hardware_uart: USB_SERIAL_JTAG

# Visibilite bas niveau cote Home Assistant (reprise du 6001B, "durcissement
# fiabilite" du 2026-09-16) : raison du dernier reset (ex. "Brownout
# reset"), memoire, duree de boucle, uptime -- diagnostic seulement, aucun
# effet sur le comportement du radar. Entites dans sensor:/text_sensor:.
debug:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  enable_btm: true
  enable_rrm: true
  # Brownout protection #2 (6001B, 2026-09-15): the radio is not started
  # during setup(); on_boot starts it explicitly after 8 s, once the radar
  # has been stopped (AT+STOP in hlk_ld6001a.cpp setup()).
  enable_on_boot: false
  # Protection brownout #3 : puissance d'emission fixee a 8,5 dBm (le
  # pilote rapporte 10 dBm pour cette consigne). Decision utilisateur du
  # 2026-09-26 apres essais (PLAN.md) : seule configuration sans aucune
  # panne ce jour-la -- premier demarrage apres OTA, demarrage a froid,
  # fonctionnement continu. Pleine puissance : 3 brownouts sur 3 au premier
  # demarrage d'une image neuve (ESPHome sonde alors tous les canaux, ses
  # donnees fast_connect etant liees au hash de configuration). Variante
  # "reduite pendant la connexion seulement" (on_connect/on_disconnect)
  # abandonnee : passage a 20 dBm sans effet, un brownout sur deux, et un
  # reset "interrupt watchdog" non explique. Liaison saine cote point
  # d'acces (-40 dBm, 0 % de retransmissions, 72,2 Mbps).
  output_power: 8.5db
  ap:
    ssid: "hlk-ld6001a-xiao-fallback"

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [hlk_ld6001a]

# Radar UART link. Meme brochage que le projet HLK-LD6001B (memes broches
# XIAO, meme carte) -- voir PROTOCOL.md.
#   D6 = GPIO43 = UART0_TX natif
#   D7 = GPIO44 = UART0_RX natif
# Cablage croise (comme tout UART) :
#   radar TX -> XIAO D7 (GPIO44) => GPIO44 est le RX de l'ESP32
#   radar RX -> XIAO D6 (GPIO43) => GPIO43 est le TX de l'ESP32
#
# Debit : 115200, confirme sur le vrai module le 2026-09-25 (trames TLV
# decodees sans erreur a ce debit) -- la mention "921600 par defaut" de la
# table AT+BAUD du manuel ne correspond pas au module livre.
#
# 2026-09-21, correctif preventif porte depuis le projet HLK-LD6001B (voir
# PORTAGE-6001B-VERS-6001A.md) : ce bus radar est volontairement le
# DEUXIEME bloc uart: declare. esphome/components/uart/
# uart_component_esp_idf.cpp assigne les peripheriques UART materiels
# (UART_NUM_0/1/2) dans l'ordre de declaration via un compteur statique
# demarrant a 0 (ne sautant que le numero deja pris par le logger -- ici
# USB_SERIAL_JTAG, donc rien a sauter). Avec un seul bloc uart:, le bus
# radar recevrait UART_NUM_0, qui coincide avec la fonction native
# UART0_TX/RX de demarrage de GPIO43/44 sur l'ESP32-S3 -- exactement la
# configuration qui a bloque 100% des commandes AT+ (0/8 AT+OK) sur le
# projet 6001B jusqu'a ce correctif. Le bus radar_uart_unused ci-dessous
# existe uniquement pour "consommer" UART_NUM_0 avant que radar_uart ne
# s'enregistre, le forcant sur UART_NUM_1 -- la matrice GPIO de l'ESP32-S3
# route n'importe quel peripherique UART sur n'importe quelle broche, donc
# UART_NUM_1 fonctionne aussi bien que UART_NUM_0 sur GPIO43/44, sans ce
# probleme. GPIO17/18 choisies pour ce bus factice : usage general
# standard sur tous les devkits ESP32-S3, non cablees a rien.
uart:
  - id: radar_uart_unused_to_claim_uart0
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 115200
  - id: radar_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
    parity: NONE
    stop_bits: 1
    # Pas de "debug:" en fonctionnement normal (retire le 2026-09-26) : il
    # recopie chaque octet recu en hexadecimal dans les logs (~3 caracteres
    # par octet, soit ~25 Ko/s de texte avec un nuage de 60-70 points a
    # 5 trames/s), formates en continu et pousses a tout client de logs.
    # Observe avec un reseau fortement degrade sur la carte (ping 0,2-1,5 s,
    # 25-50 % de pertes, page web 1-6 s). Pour diagnostiquer temporairement
    # qu'une commande AT+ atteint le fil (MAINTENANCE.md), rajouter :
    #   debug:
    #     direction: BOTH

hlk_ld6001a:
  id: radar
  uart_id: radar_uart

