substitutions:
  name: "hlk-ld6001a-xiao"
  friendly_name: "HLK-LD6001A plafond (XIAO ESP32-S3)"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # Meme sequence de demarrage prudente que le projet HLK-LD6001B (attente
  # WiFi confirmee avant tout AT+RESET, evite le brownout documente dans
  # HLK-LD6001B/XIAO-ESP32S3/MAINTENANCE.md) -- voir PROTOCOL.md et
  # hlk_ld6001a.cpp::loop() pour la suite de la sequence (reglages puis
  # AT+DEBUG=3, pas AT+DEBUG=0 comme le 6001B).
  on_boot:
    priority: -100
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - delay: 2s
      - uart.write:
          id: radar_uart
          data: "AT+RESET\n"

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
    # Meme raison que le projet HLK-LD6001B : le composant hlk_ld6001a
    # lance son propre esp_http_server (3D viewer + reglages), qu'ESPHome
    # ne compte pas dans son auto-dimensionnement de
    # CONFIG_LWIP_MAX_SOCKETS -- sans ce reglage, epuisement du pool de
    # sockets ("httpd_accept_conn: error in accept (23)") en usage reel.
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "24"

# Port USB natif du S3 (USB-CDC) -- logs forces sur USB_SERIAL_JTAG pour ne
# jamais disputer GPIO43/44 (UART0 ROM bootloader) avec le bus UART du
# radar ci-dessous.
logger:
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  enable_btm: true
  enable_rrm: true
  ap:
    ssid: "hlk-ld6001a-xiao-fallback"

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [hlk_ld6001a]

# Radar UART link. Meme brochage que le projet HLK-LD6001B (memes broches
# XIAO, meme carte) -- voir PROTOCOL.md.
#   D6 = GPIO43 = UART0_TX natif
#   D7 = GPIO44 = UART0_RX natif
# Cablage croise (comme tout UART) :
#   radar TX -> XIAO D7 (GPIO44) => GPIO44 est le RX de l'ESP32
#   radar RX -> XIAO D6 (GPIO43) => GPIO43 est le TX de l'ESP32
#
# Debit ambigu selon la source (voir PROTOCOL.md, "Debit UART") -- 115200
# essaye en premier ; passer a 921600 si aucune trame ne sort au premier
# branchement (voir DEPLOYMENT.md).
#
# 2026-09-21, correctif preventif porte depuis le projet HLK-LD6001B (voir
# PORTAGE-6001B-VERS-6001A.md) : ce bus radar est volontairement le
# DEUXIEME bloc uart: declare. esphome/components/uart/
# uart_component_esp_idf.cpp assigne les peripheriques UART materiels
# (UART_NUM_0/1/2) dans l'ordre de declaration via un compteur statique
# demarrant a 0 (ne sautant que le numero deja pris par le logger -- ici
# USB_SERIAL_JTAG, donc rien a sauter). Avec un seul bloc uart:, le bus
# radar recevrait UART_NUM_0, qui coincide avec la fonction native
# UART0_TX/RX de demarrage de GPIO43/44 sur l'ESP32-S3 -- exactement la
# configuration qui a bloque 100% des commandes AT+ (0/8 AT+OK) sur le
# projet 6001B jusqu'a ce correctif. Le bus radar_uart_unused ci-dessous
# existe uniquement pour "consommer" UART_NUM_0 avant que radar_uart ne
# s'enregistre, le forcant sur UART_NUM_1 -- la matrice GPIO de l'ESP32-S3
# route n'importe quel peripherique UART sur n'importe quelle broche, donc
# UART_NUM_1 fonctionne aussi bien que UART_NUM_0 sur GPIO43/44, sans ce
# probleme. GPIO17/18 choisies pour ce bus factice : usage general
# standard sur tous les devkits ESP32-S3, non cablees a rien.
uart:
  - id: radar_uart_unused_to_claim_uart0
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 115200
  - id: radar_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
    parity: NONE
    stop_bits: 1
    debug:
      # RX only -- passer a BOTH temporairement pour verifier qu'une
      # commande AT+ atteint reellement le fil (voir MAINTENANCE.md).
      direction: RX

hlk_ld6001a:
  id: radar
  uart_id: radar_uart

binary_sensor:
  - platform: hlk_ld6001a
    has_target:
      id: presence_bs
      name: "Presence"

sensor:
