    target_count:
      id: people_count_sensor
      name: "People Count"
    recovery_count:
      name: "Radar Recovery Count"
    # Pas de Respiration/Frequence cardiaque/Geste ici (contrairement au
    # HLK-LD6001B) : le protocole AT+DEBUG=3 ne fournit pas ces champs du
    # tout pour ce module -- voir PROTOCOL.md.
